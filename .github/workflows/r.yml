name: Budapest vízállás

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: R telepítése
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: R csomagok telepítése
        run: |
          install.packages("rvest")
          install.packages("stringr")
        shell: Rscript {0}

      - name: Budapest vízállás program futtatása
        run: Rscript budapest_vizallas_06.R

      - name: HTML mentése a repositoryba
        run: |
          cp budapest_vizallas.html index.html
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budapest_vizallas.html index.html
          git diff --cached --quiet || git commit -m "Frissített budapesti vízállás"
          git push
