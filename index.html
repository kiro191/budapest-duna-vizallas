<!DOCTYPE html>
<html lang='hu'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<title>Budapest Duna vízállás</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 30px 20px;
    box-sizing: border-box;
}

.city {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 5px;
}

.river {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.station {
    font-size: 16px;
    color: #666666;
    margin-bottom: 45px;
}

.water {
    font-size: 110px;
    font-weight: 700;
    line-height: 1;
}

.unit {
    font-size: 30px;
    margin-top: 5px;
    margin-bottom: 45px;
}

.time {
    font-size: 18px;
    color: #555555;
}

.source {
    margin-top: 50px;
    font-size: 13px;
    color: #888888;
}

</style>
</head>

<body>

<div class='container'>

    <div class='city'>BUDAPEST</div>

    <div class='river'>DUNA</div>

    <div class='station'>1646,5 fkm</div>

    <div class='water'>22</div>

    <div class='unit'>cm</div>
