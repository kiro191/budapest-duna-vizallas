<!DOCTYPE html>
<html lang='hu'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<title>Budapest, Paks vízállásai</title>

<meta property='og:title' content='Budapest, Paks vízállásai'>
<meta property='og:description' content='A Duna aktuális vízállása Budapestnél és Paksnál.'>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 30px 20px 40px;
    box-sizing: border-box;
}

.page-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.station-block {
    margin-bottom: 45px;
}

.city {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 5px;
}

.river {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.station {
    font-size: 16px;
    color: #666666;
    margin-bottom: 25px;
}

.water {
    font-size: 100px;
    font-weight: 700;
    line-height: 1;
}

.unit {
    font-size: 30px;
    margin-top: 5px;
    margin-bottom: 25px;
}

.time {
    font-size: 18px;
    color: #555555;
}

.source {
    margin-top: 35px;
    font-size: 13px;
    color: #888888;
}

.separator {
    border: 0;
    border-top: 1px solid #dddddd;
    margin: 10px 0 45px;
}

@media (max-width: 420px) {
    .page-title {
        font-size: 24px;
    }

    .water {
        font-size: 90px;
    }

    .city {
        font-size: 25px;
    }
}

</style>
</head>

<body>

<div class='container'>

    <div class='page-title'>Budapest, Paks vízállásai</div>

    <div class='station-block'>

        <div class='city'>BUDAPEST</div>
        <div class='river'>DUNA</div>
        <div class='station'>1646,5 fkm · vízmérce 1026</div>

        <div class='water'>13</div>

        <div class='unit'>cm</div>

        <div class='time'>2026.08.18. 14:00</div>

    </div>

    <hr class='separator'>

    <div class='station-block'>

        <div class='city'>PAKS</div>
        <div class='river'>DUNA</div>
        <div class='station'>1531,3 fkm · vízmérce 549</div>

        <div class='water'>-130</div>

        <div class='unit'>cm</div>

        <div class='time'>2026.08.18. 14:00</div>

    </div>

    <div class='source'>
        Forrás: Vízügy · KDTVIZIG
    </div>

</div>

</body>
</html>
